<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Date-navi Keyword Editor v2</title>
    <style>
      :root {
        /* Date-navi design tokens — mirrored from constants/design-tokens.ts. */
        --canvas: #e9e5e5;
        --screen: #fff9fc;
        --surface: #ffffff;
        --surface-disabled: #efe7df;
        --brand-primary: #f26b7a;
        --brand-strong: #c24b57;
        --brand-subtle: #ffeef0;
        --brand-border: #f2a8b0;
        --text-primary: #3b2e2e;
        --text-secondary: #8a7f76;
        --text-muted: #a89b92;
        --text-disabled: #b8aea6;
        --text-placeholder: #c8bcb1;
        --border-default: #f2e0dc;
        --border-subtle: #f2e7dc;
        --danger: #ff4f6d;
        --spacing-xs: 4px;
        --spacing-sm: 8px;
        --spacing-md: 12px;
        --spacing-lg: 16px;
        --spacing-screen: 20px;
        --spacing-xxl: 24px;
        --radius-input: 16px;
        --radius-button: 18px;
        --radius-chip: 20px;
        --radius-card: 22px;
        --touch: 44px;
        --input-height: 52px;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: flex;
        min-height: 100vh;
        justify-content: center;
        padding: 56px 16px 24px;
        background: var(--canvas);
        color: var(--text-primary);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      }
      button, input { font: inherit; }
      button { border: 0; }

      .toolbar {
        position: fixed;
        top: 12px;
        left: 50%;
        z-index: 5;
        display: flex;
        gap: var(--spacing-xs);
        transform: translateX(-50%);
      }
      .toolbar button {
        min-height: 32px;
        padding: 0 var(--spacing-md);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-chip);
        background: var(--surface);
        color: var(--text-secondary);
        font-size: 12px;
        cursor: pointer;
      }
      .toolbar button.active {
        border-color: var(--brand-primary);
        background: var(--brand-subtle);
        color: var(--brand-strong);
        font-weight: 700;
      }
      .toolbar button.preview-full {
        border-color: var(--brand-primary);
        color: var(--brand-strong);
      }

      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: var(--screen);
      }
      .screen {
        height: 100%;
        overflow-y: auto;
        padding: 20px 20px 32px;
      }

      .header {
        display: flex;
        width: 350px;
        height: 44px;
        align-items: center;
        justify-content: space-between;
      }
      .back {
        display: grid;
        width: var(--touch);
        height: var(--touch);
        place-items: center;
        color: var(--text-primary);
      }
      .back svg { width: 24px; height: 24px; }
      .progress {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--border-default); }
      .dot.active { width: 24px; background: var(--brand-primary); }
      .count { width: 28px; color: var(--text-muted); font-size: 11px; line-height: 16px; text-align: right; }

      .intro { margin-top: 16px; }
      h1 { margin: 0; font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.7px; }
      .subtitle { margin: 4px 0 0; color: var(--text-secondary); font-size: 14px; line-height: 22px; }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--spacing-sm);
        margin-top: 24px;
      }
      .category-chip {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-xs);
        padding: 0 var(--spacing-xs);
        border: 1px solid var(--brand-border);
        border-radius: var(--radius-button);
        background: var(--surface);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .category-chip.selected {
        border-width: 1.5px;
        border-color: var(--brand-primary);
        background: var(--brand-subtle);
        color: var(--brand-strong);
      }
      .category-chip svg { width: 18px; height: 18px; }

      .step-card {
        margin-top: 24px;
        padding: var(--spacing-md);
        border: 1.5px solid var(--brand-border);
        border-radius: var(--radius-card);
        background: var(--surface);
      }
      .step-row {
        display: flex;
        min-height: 44px;
        align-items: center;
        gap: var(--spacing-sm);
      }
      .step-number { width: 16px; color: var(--brand-strong); font-size: 13px; font-weight: 700; text-align: center; }
      .step-icon { width: 20px; height: 20px; color: var(--brand-strong); }
      .step-label { font-size: 16px; line-height: 24px; font-weight: 700; }
      .chevron { width: 20px; height: 20px; margin-left: auto; color: var(--text-secondary); }
      .question { margin: var(--spacing-md) 0 var(--spacing-sm); font-size: 15px; line-height: 20px; font-weight: 700; }

      .preference-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-sm);
        padding-right: var(--spacing-xs);
      }
      .preference-slot {
        position: relative;
        display: inline-flex;
      }
      .preference-chip {
        min-height: 44px;
        padding: 0 var(--spacing-md);
        border: 1px solid var(--brand-border);
        border-radius: var(--radius-chip);
        background: var(--surface);
        color: var(--brand-strong);
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        cursor: pointer;
      }
      .preference-chip.selected {
        border-width: 1.5px;
        border-color: var(--brand-border);
        background: var(--brand-subtle);
        color: var(--brand-strong);
        font-weight: 700;
      }
      .remove-hit {
        position: absolute;
        top: -15px;
        right: -15px;
        display: grid;
        width: var(--touch);
        height: var(--touch);
        place-items: center;
        background: transparent;
        cursor: pointer;
      }
      .remove-icon {
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 999px;
        background: var(--text-muted);
        color: var(--surface);
      }
      .remove-icon svg { width: 12px; height: 12px; }

      .add-row {
        display: flex;
        gap: var(--spacing-sm);
        margin-top: var(--spacing-md);
      }
      .keyword-input {
        min-width: 0;
        flex: 1;
        height: var(--input-height);
        padding: 0 var(--spacing-md);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-input);
        outline: 0;
        background: var(--surface);
        color: var(--text-primary);
        font-size: 14px;
      }
      .keyword-input::placeholder { color: var(--text-placeholder); }
      .keyword-input:focus { border-width: 1.5px; border-color: var(--brand-primary); }
      .add-button {
        flex: 0 0 auto;
        min-width: 64px;
        min-height: var(--input-height);
        padding: 0 var(--spacing-md);
        border: 1px solid var(--brand-border);
        border-radius: var(--radius-button);
        background: var(--brand-subtle);
        color: var(--brand-strong);
        font-size: 15px;
        line-height: 20px;
        font-weight: 600;
        cursor: pointer;
      }
      .add-button:disabled { border-color: var(--border-subtle); background: var(--surface-disabled); color: var(--text-disabled); cursor: default; }
      .add-button:active, .preference-chip:active, .category-chip:active { opacity: .88; }

      .note {
        margin: var(--spacing-md) 0 0;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 16px;
      }
      .limit-note {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-xs);
        margin: var(--spacing-md) 0 0;
        padding: var(--spacing-md);
        border: 1px solid #ffd0d9;
        border-radius: var(--radius-input);
        background: #fff5f7;
        color: var(--danger);
        font-size: 12px;
        line-height: 18px;
      }
      .limit-note[hidden] { display: none; }
      .limit-count { font-weight: 700; }
      .cta {
        display: grid;
        width: 350px;
        min-height: 52px;
        margin-top: 32px;
        place-items: center;
        border-radius: var(--radius-button);
        background: var(--brand-primary);
        color: var(--surface);
        font-size: 15px;
        font-weight: 600;
      }
      .state-label {
        margin-top: 12px;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 16px;
        text-align: center;
      }

      @media (max-width: 430px) {
        body { padding-right: 0; padding-left: 0; }
        .toolbar { top: 8px; }
        .phone { width: 100vw; }
      }
      @media (prefers-reduced-motion: reduce) {
        .add-button, .preference-chip, .category-chip { transition: none; }
      }
    </style>
  </head>
  <body>
    <nav class="toolbar" aria-label="Keyword editor preview controls">
      <button type="button" data-language="ko" class="active">한국어</button>
      <button type="button" data-language="en">English</button>
      <button type="button" data-preview-full class="preview-full">20개 상태</button>
      <button type="button" data-reset>초기화</button>
    </nav>

    <main class="phone">
      <section class="screen" aria-label="Course keyword editor preview">
        <div class="header">
          <div class="back" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6" /></svg>
          </div>
          <div class="progress" aria-hidden="true"><i class="dot active"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
          <div class="count">1 / 5</div>
        </div>

        <div class="intro">
          <h1 data-copy="title">데이트 코스 만들기</h1>
          <p class="subtitle" data-copy="subtitle">원하는 단계와 조건을 선택하면 딱 맞는 코스를 제안해드려요.</p>
        </div>

        <div class="category-grid" id="category-grid"></div>

        <article class="step-card">
          <div class="step-row">
            <span class="step-number">2</span>
            <svg class="step-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z" /></svg>
            <span class="step-label" id="step-label">액티비티</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6" /></svg>
          </div>
          <p class="question" id="question">어떤 액티비티를 원해요?</p>
          <div class="preference-wrap" id="preference-wrap"></div>
          <form class="add-row" id="add-form">
            <input class="keyword-input" id="keyword-input" maxlength="40" autocomplete="off" data-placeholder="placeholder" placeholder="직접 입력" />
            <button class="add-button" id="add-button" type="submit" disabled>추가</button>
          </form>
          <p class="limit-note" id="limit-note" role="status" hidden>
            <span class="limit-count" id="limit-count">개인 키워드 20/20</span>
            <span id="limit-message">새 키워드는 목록에 저장되지 않지만, 이번 추천에는 적용돼요. 기존 키워드를 삭제하면 다시 저장할 수 있어요.</span>
          </p>
          <p class="note" id="note">키워드는 하나만 선택할 수 있어요.</p>
        </article>

        <div class="state-label" id="state-label">현재 선택: 아무거나</div>
        <div class="cta" data-copy="cta">다음</div>
      </section>
    </main>

    <script>
      const copy = {
        ko: {
          title: '데이트 코스 만들기',
          subtitle: '원하는 단계와 조건을 선택하면 딱 맞는 코스를 제안해드려요.',
          cta: '다음',
          placeholder: '직접 입력',
          add: '추가',
          note: '키워드는 하나만 선택할 수 있어요.',
          limitNote: '새 키워드는 목록에 저장되지 않지만, 이번 추천에는 적용돼요. 기존 키워드를 삭제하면 다시 저장할 수 있어요.',
          personalCount: '개인 키워드',
          temporaryChoice: '이번 추천에만 적용',
          selected: '현재 선택',
          anything: '아무거나',
          stepQuestion: {
            meal: '어떤 메뉴 느낌이 좋아요?',
            cafe: '어떤 분위기가 좋아요?',
            drinks: '어떤 술집을 원해요?',
            activity: '어떤 액티비티를 원해요?',
            culture: '어떤 문화를 즐기고 싶어요?',
            walk: '어떤 산책을 원해요?'
          },
          categories: { meal: '식사', cafe: '카페', walk: '산책', culture: '문화', activity: '액티비티', drinks: '술집' },
          meal: ['고기', '한식', '일식', '양식', '가볍게'],
          cafe: ['루프탑 카페', '디저트', '북카페'],
          drinks: ['와인바', '칵테일', '수제맥주'],
          activity: ['보드게임', '방탈출', '볼링', '클라이밍'],
          culture: ['전시', '미술관', '공연'],
          walk: ['한강 산책', '공원 산책']
        },
        en: {
          title: 'Plan your date course',
          subtitle: "Pick the steps and preferences, and we'll suggest a course that fits.",
          cta: 'Next',
          placeholder: 'Add a keyword',
          add: 'Add',
          note: 'Choose one keyword at a time.',
          limitNote: 'New keywords are not saved to the list, but they still apply to this recommendation. Delete an existing keyword to save one later.',
          personalCount: 'Personal keywords',
          temporaryChoice: 'This recommendation only',
          selected: 'Current choice',
          anything: 'Anything',
          stepQuestion: {
            meal: 'What kind of meal sounds good?',
            cafe: 'What kind of cafe mood?',
            drinks: 'What kind of bar?',
            activity: 'What kind of activity?',
            culture: 'What kind of culture?',
            walk: 'What kind of walk?'
          },
          categories: { meal: 'Meal', cafe: 'Cafe', walk: 'Walk', culture: 'Culture', activity: 'Activity', drinks: 'Drinks' },
          meal: ['Meat', 'Korean', 'Japanese', 'Western', 'Light meal'],
          cafe: ['Rooftop cafe', 'Dessert', 'Book cafe'],
          drinks: ['Wine bar', 'Cocktail', 'Craft beer'],
          activity: ['Board games', 'Escape room', 'Bowling', 'Climbing'],
          culture: ['Exhibition', 'Art museum', 'Performance'],
          walk: ['Han River walk', 'Park walk']
        }
      };

      const categories = ['meal', 'cafe', 'walk', 'culture', 'activity', 'drinks'];
      const icons = {
        meal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
        cafe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8h2a4 4 0 0 1 0 8h-2"/><path d="M3 8h13v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg>',
        walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/></svg>',
        culture: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a12 12 0 0 1 0 16M12 4a12 12 0 0 0 0 16"/></svg>',
        activity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m13 2-9 12h7l-1 8 9-12h-7l1-8Z"/></svg>',
        drinks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h14l-1 6a6 6 0 0 1-5 5v5h4v2H7v-2h4v-5a6 6 0 0 1-5-5Z"/></svg>'
      };

      let language = 'ko';
      let category = 'activity';
      let selected = null;
      let removed = new Set();
      let custom = {};
      let pending = null;
      let limitReached = false;
      const MAX_PERSONAL_TAGS = 20;

      function normalize(value) { return value.normalize('NFKC').trim().replace(/\s+/g, ' ').toLocaleLowerCase(); }
      function tagId(label) { return `tag:${normalize(label)}`; }

      function renderCopy() {
        const text = copy[language];
        document.querySelector('[data-copy="title"]').textContent = text.title;
        document.querySelector('[data-copy="subtitle"]').textContent = text.subtitle;
        document.querySelector('[data-copy="cta"]').textContent = text.cta;
        document.querySelector('[data-placeholder="placeholder"]').placeholder = text.placeholder;
        document.querySelector('#add-button').textContent = text.add;
        document.querySelector('#note').textContent = text.note;
        document.querySelector('#limit-message').textContent = text.limitNote;
      }

      function renderCategories() {
        const text = copy[language];
        document.querySelector('#category-grid').innerHTML = categories.map((item) => `
          <button type="button" class="category-chip ${item === category ? 'selected' : ''}" data-category="${item}">
            ${icons[item]}<span>${text.categories[item]}</span>
          </button>
        `).join('');
        document.querySelectorAll('[data-category]').forEach((button) => button.addEventListener('click', () => {
          category = button.dataset.category;
          selected = null;
          removed = new Set();
          pending = null;
          limitReached = false;
          render();
        }));
      }

      function removableTags() {
        const text = copy[language];
        const defaults = text[category].map((label) => ({ label, id: tagId(label), custom: false }));
        const personal = (custom[category] ?? []).map((label) => ({ label, id: tagId(label), custom: true }));
        return [...defaults, ...personal].filter((item) => !removed.has(item.id));
      }

      function xIcon() {
        return '<span class="remove-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 6 12 12M18 6 6 18"/></svg></span>';
      }

      function renderPreferences() {
        const text = copy[language];
        const options = [{ label: text.anything, id: 'anything', anything: true }, ...removableTags()];
        document.querySelector('#step-label').textContent = text.categories[category];
        document.querySelector('#question').textContent = text.stepQuestion[category];
        document.querySelector('#preference-wrap').innerHTML = options.map((option) => `
          <span class="preference-slot">
            <button type="button" class="preference-chip ${option.id === 'anything' ? 'anything' : ''} ${selected === option.id || (!selected && option.id === 'anything') ? 'selected' : ''}" data-tag="${option.id}">${option.label}</button>
            ${option.anything ? '' : `<button type="button" class="remove-hit" aria-label="${language === 'ko' ? `${option.label} 키워드 삭제` : `Remove ${option.label}`}" data-remove="${option.id}">${xIcon()}</button>`}
          </span>
        `).join('');

        document.querySelectorAll('[data-tag]').forEach((button) => button.addEventListener('click', () => {
          pending = null;
          selected = button.dataset.tag === 'anything' ? null : button.dataset.tag;
          renderPreferences();
          renderState();
        }));
        document.querySelectorAll('[data-remove]').forEach((button) => button.addEventListener('click', (event) => {
          event.stopPropagation();
          const id = button.dataset.remove;
          removed.add(id);
          custom[category] = (custom[category] ?? []).filter((label) => tagId(label) !== id);
          if (selected === id) selected = null;
          limitReached = (custom[category] ?? []).length >= MAX_PERSONAL_TAGS;
          renderPreferences();
          renderState();
        }));
      }

      function renderState() {
        const text = copy[language];
        const temporarySelection = pending?.category === category && pending.id === selected;
        const selectedLabel = selected === null
          ? text.anything
          : removableTags().find((item) => item.id === selected)?.label
            ?? (temporarySelection ? pending.label : text.anything);
        document.querySelector('#state-label').textContent = `${text.selected}: ${selectedLabel}${temporarySelection ? ` · ${text.temporaryChoice}` : ''}`;
        const personalCount = (custom[category] ?? []).length;
        document.querySelector('#limit-note').hidden = !(limitReached || personalCount >= MAX_PERSONAL_TAGS);
        document.querySelector('#limit-count').textContent = `${text.personalCount} ${personalCount}/${MAX_PERSONAL_TAGS}`;
      }

      function render() {
        renderCopy();
        renderCategories();
        renderPreferences();
        renderState();
      }

      document.querySelector('#add-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const input = document.querySelector('#keyword-input');
        const value = input.value.trim().replace(/\s+/g, ' ');
        if (!value) return;
        const id = tagId(value);
        const alreadyExists = removableTags().some((item) => item.id === id);
        const alreadyPersonal = (custom[category] ?? []).some((label) => tagId(label) === id);
        const personalCount = (custom[category] ?? []).length;
        if (!alreadyExists && !alreadyPersonal && personalCount >= MAX_PERSONAL_TAGS) {
          pending = { category, id, label: value };
          limitReached = true;
          selected = id;
          input.value = '';
          renderState();
          input.focus();
          return;
        }
        if (!alreadyExists && !alreadyPersonal) custom[category] = [...(custom[category] ?? []), value];
        pending = null;
        limitReached = (custom[category] ?? []).length >= MAX_PERSONAL_TAGS;
        removed.delete(id);
        selected = id;
        input.value = '';
        renderPreferences();
        renderState();
        input.focus();
      });

      document.querySelector('#keyword-input').addEventListener('input', (event) => {
        document.querySelector('#add-button').disabled = !event.target.value.trim();
      });

      document.querySelectorAll('[data-language]').forEach((button) => button.addEventListener('click', () => {
        language = button.dataset.language;
        document.querySelectorAll('[data-language]').forEach((item) => item.classList.toggle('active', item.dataset.language === language));
        selected = null;
        removed = new Set();
        pending = null;
        limitReached = false;
        render();
      }));

      document.querySelector('[data-preview-full]').addEventListener('click', () => {
        custom[category] = Array.from({ length: MAX_PERSONAL_TAGS }, (_, index) => `${copy[language].categories[category]} 키워드 ${index + 1}`);
        selected = null;
        removed = new Set();
        pending = null;
        limitReached = true;
        render();
      });

      document.querySelector('[data-reset]').addEventListener('click', () => {
        language = 'ko';
        category = 'activity';
        selected = null;
        removed = new Set();
        custom = {};
        pending = null;
        limitReached = false;
        document.querySelectorAll('[data-language]').forEach((item) => item.classList.toggle('active', item.dataset.language === language));
        render();
      });

      render();
    </script>
  </body>
</html>
