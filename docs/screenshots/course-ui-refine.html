<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Date-navi Refine Candidate UI</title>
    <style>
      :root {
        --canvas: #e9e5e5;
        --screen: #fff9fc;
        --white: #ffffff;
        --pink: #f26b7a;
        --pink-deep: #c24b57;
        --pink-light: #ffedef;
        --pink-border: #f2a8b0;
        --strong: #3b2e2e;
        --sub: #8a7f76;
        --muted: #a89b92;
        --border: #f2e0dc;
        --divider: #f5e5e8;
        --cream: #fff3e0;
        --cream-fg: #a77738;
        --cream-border: #f4e2ce;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: flex;
        min-height: 100vh;
        justify-content: center;
        padding: 56px 16px 24px;
        background: var(--canvas);
        color: var(--strong);
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      }
      button { font: inherit; }

      .toolbar {
        position: fixed;
        top: 12px;
        left: 50%;
        z-index: 10;
        display: flex;
        gap: 6px;
        transform: translateX(-50%);
      }
      .toolbar button {
        padding: 7px 12px;
        border: 1px solid #d8cccc;
        border-radius: 999px;
        background: #fff;
        color: var(--sub);
        font-size: 12px;
        cursor: pointer;
      }
      .toolbar button.active { border-color: var(--pink); background: var(--pink-light); color: var(--pink-deep); font-weight: 700; }

      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        background: var(--screen);
      }
      .screen { display: none; position: absolute; inset: 0; }
      .screen.active { display: block; }

      .header {
        position: absolute;
        top: 20px;
        left: 20px;
        display: flex;
        width: 350px;
        height: 44px;
        align-items: center;
        justify-content: space-between;
      }
      .back { display: grid; width: 44px; height: 44px; place-items: center; color: var(--strong); }
      .back svg { width: 24px; height: 24px; }
      .dots { display: flex; gap: 6px; align-items: center; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
      .dot.active { width: 24px; border-radius: 999px; background: var(--pink); }
      .count { width: 28px; color: var(--muted); font-size: 11px; line-height: 16px; text-align: right; }

      .intro { position: absolute; top: 80px; left: 20px; width: 350px; }
      h1 { height: 44px; margin: 0; font-size: 26px; font-weight: 800; line-height: 44px; letter-spacing: -.9px; }
      .subtitle { height: 24px; margin: 0; color: var(--sub); font-size: 13px; line-height: 24px; white-space: nowrap; }

      /* Input Refine Candidate / 04 */
      .mood-grid {
        position: absolute;
        top: 184px;
        left: 20px;
        display: grid;
        width: 350px;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px 8px;
      }
      .mood-card {
        display: flex;
        min-height: 104px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--pink-border);
        border-radius: 18px;
        background: var(--white);
        color: var(--muted);
        cursor: pointer;
        transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 100ms ease;
      }
      .mood-card:active { transform: scale(.985); }
      .mood-card.selected { border-color: var(--pink); background: var(--pink-light); color: var(--pink-deep); }
      .mood-card svg, .unsure svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
      .mood-card span { font-size: 12px; font-weight: 600; text-align: center; }
      .mood-card.selected span { font-weight: 700; }

      .unsure {
        position: absolute;
        top: 420px;
        left: 20px;
        display: flex;
        width: 350px;
        min-height: 56px;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border: 1px solid var(--cream-border);
        border-radius: 18px;
        background: var(--cream);
        color: var(--muted);
        cursor: pointer;
        text-align: left;
        transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 100ms ease;
      }
      .unsure:active { transform: scale(.992); border-width: 2px; border-color: var(--cream-fg); color: var(--cream-fg); }
      .unsure.selected, .unsure:focus-visible { border-width: 2px; border-color: var(--cream-fg); background: var(--cream); color: var(--cream-fg); outline: none; }
      .unsure span { font-size: 12px; font-weight: 600; }
      .unsure:active span, .unsure.selected span, .unsure:focus-visible span { font-weight: 700; }

      .cta {
        position: absolute;
        bottom: 20px;
        left: 20px;
        display: grid;
        width: 350px;
        height: 52px;
        place-items: center;
        border-radius: 18px;
        background: var(--pink);
        color: var(--white);
        font-size: 15px;
        font-weight: 700;
      }

      /* Input Refine Candidate / 05 */
      .review-summary {
        position: absolute;
        top: 184px;
        left: 20px;
        width: 350px;
        height: 310px;
        padding: 14px 16px 16px;
        overflow: hidden;
        border: 1px solid #f2bdc2;
        border-radius: 22px;
        background: var(--white);
      }
      .review-course { height: 45px; }
      .review-label { color: var(--strong); font-size: 11px; font-weight: 700; line-height: 13px; }
      .course-row {
        display: flex;
        height: 24px;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        overflow: hidden;
        color: var(--strong);
        font-size: 12px;
        font-weight: 700;
        line-height: 24px;
        white-space: nowrap;
      }
      .course-row svg, .review-value svg { width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
      .review-separator { height: 1px; margin-top: 16px; margin-bottom: 9px; background: var(--divider); }
      .review-field { height: 48px; margin-bottom: 16px; }
      .review-field:last-child { margin-bottom: 0; }
      .review-value-row { display: flex; height: 24px; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
      .review-value { display: flex; min-width: 0; align-items: center; gap: 8px; overflow: hidden; color: var(--strong); font-size: 13px; font-weight: 700; line-height: 24px; white-space: nowrap; }
      .edit { flex: 0 0 auto; color: var(--pink-deep); font-size: 11px; font-weight: 700; line-height: 24px; }
      .review-cta { top: 760px; bottom: auto; }

      @media (max-width: 430px) {
        body { padding-right: 0; padding-left: 0; }
        .toolbar { top: 8px; }
        .phone { width: 100vw; }
      }
      @media (prefers-reduced-motion: reduce) {
        .mood-card, .unsure { transition-duration: 0ms; }
      }
    </style>
  </head>
  <body>
    <nav class="toolbar" aria-label="Refine Candidate preview screens">
      <button type="button" data-screen-button="mood">04 · 분위기</button>
      <button type="button" data-screen-button="review">05 · 확인</button>
    </nav>

    <main class="phone">
      <section class="screen" data-screen="mood" aria-label="Input Refine Candidate 04">
        <div class="header">
          <div class="back" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6" /></svg></div>
          <div class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot active"></i><i class="dot"></i></div>
          <div class="count">4 / 5</div>
        </div>
        <div class="intro"><h1>어떤 분위기를 원해요?</h1><p class="subtitle">원하는 분위기를 선택해주세요. 복수 선택이 가능해요.</p></div>
        <div class="mood-grid" id="mood-grid"></div>
        <button class="unsure selected" id="unsure" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" x2="9.01" y1="9" y2="9"></line><line x1="15" x2="15.01" y1="9" y2="9"></line></svg>
          <span>잘 모르겠어요 — 추천에 맡길게요</span>
        </button>
        <div class="cta">다음</div>
      </section>

      <section class="screen" data-screen="review" aria-label="Input Refine Candidate 05">
        <div class="header">
          <div class="back" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6" /></svg></div>
          <div class="dots" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot active"></i></div>
          <div class="count">5 / 5</div>
        </div>
        <div class="intro"><h1>이대로 만들까요?</h1><p class="subtitle">선택한 내용을 확인하고 데이트 코스를 만들어볼까요?</p></div>
        <div class="review-summary">
          <div class="review-course">
            <div class="review-label">코스</div>
            <div class="course-row">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg><span>식사</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2v2"></path><path d="M14 2v2"></path><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"></path><path d="M6 2v2"></path></svg><span>카페</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"></path><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"></path><path d="M16 17h4"></path><path d="M4 13h4"></path></svg><span>산책</span>
            </div>
          </div>
          <div class="review-separator"></div>
          <div class="review-field"><div class="review-label">지역</div><div class="review-value-row"><div class="review-value"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg><span>성수동</span></div><span class="edit">수정</span></div></div>
          <div class="review-separator"></div>
          <div class="review-field"><div class="review-label">시간</div><div class="review-value-row"><div class="review-value"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6h4"></path></svg><span>오늘 오후 6:00</span></div><span class="edit">수정</span></div></div>
          <div class="review-separator"></div>
          <div class="review-field"><div class="review-label">분위기</div><div class="review-value-row"><div class="review-value"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path></svg><span>감성적인 · 조용한</span></div><span class="edit">수정</span></div></div>
        </div>
        <div class="cta review-cta">데이트 코스 만들기</div>
      </section>
    </main>

    <script>
      const moodOptions = [
        ['emotional', '감성적인', '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path>'],
        ['comfortable', '편안한', '<path d="M12 7v14"></path><path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"></path><path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5"></path><rect x="3" y="7" width="18" height="4" rx="1"></rect>'],
        ['lively', '활기찬', '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><circle cx="4" cy="20" r="2"></circle>'],
        ['romantic', '로맨틱한', '<path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"></path>'],
        ['quiet', '조용한', '<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path>'],
        ['novel', '새로운/특별한', '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path>'],
      ];
      const moodGrid = document.querySelector('#mood-grid');
      const unsure = document.querySelector('#unsure');
      const selectedMoods = new Set();

      moodOptions.forEach(([key, label, icon]) => {
        const button = document.createElement('button');
        button.className = 'mood-card';
        button.type = 'button';
        button.dataset.mood = key;
        button.setAttribute('aria-pressed', 'false');
        button.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><span>${label}</span>`;
        button.addEventListener('click', () => {
          if (selectedMoods.has(key)) selectedMoods.delete(key);
          else selectedMoods.add(key);
          updateMoodState();
        });
        moodGrid.append(button);
      });

      function updateMoodState() {
        moodGrid.querySelectorAll('[data-mood]').forEach((button) => {
          const selected = selectedMoods.has(button.dataset.mood);
          button.classList.toggle('selected', selected);
          button.setAttribute('aria-pressed', String(selected));
        });
        const unsureSelected = selectedMoods.size === 0;
        unsure.classList.toggle('selected', unsureSelected);
        unsure.setAttribute('aria-pressed', String(unsureSelected));
      }

      unsure.addEventListener('click', () => {
        selectedMoods.clear();
        updateMoodState();
      });

      const screens = document.querySelectorAll('[data-screen]');
      const screenButtons = document.querySelectorAll('[data-screen-button]');
      function showScreen(name) {
        screens.forEach((screen) => screen.classList.toggle('active', screen.dataset.screen === name));
        screenButtons.forEach((button) => button.classList.toggle('active', button.dataset.screenButton === name));
        history.replaceState(null, '', `?screen=${name}`);
      }
      screenButtons.forEach((button) => button.addEventListener('click', () => showScreen(button.dataset.screenButton)));
      showScreen(new URLSearchParams(location.search).get('screen') === 'mood' ? 'mood' : 'review');
    </script>
  </body>
</html>
